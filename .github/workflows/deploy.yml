
name: Deploy Django to AWS EC2

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Django with Docker
    runs-on: [self-hosted, linux, x64]

    steps:
      # Step 1: Deploy application
      - name: Deploy Django application
        shell: bash
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_DEBUG: ${{ secrets.DJANGO_DEBUG }}

        run: |
          set -Eeuo pipefail

          echo "================================"
          echo "Starting Django deployment"
          echo "================================"

          # Verify required secrets
          if [ -z "${DJANGO_SECRET_KEY:-}" ]; then
            echo "ERROR: DJANGO_SECRET_KEY is missing."
            exit 1
          fi

          export DJANGO_SECRET_KEY
          export DJANGO_DEBUG="${DJANGO_DEBUG:-False}"

          # Navigate to project repository on AWS
          cd /home/ubuntu/projects/Future-Byte-Technology

          echo "Fetching latest GitHub code..."

          git fetch origin main
          git reset --hard origin/main

          # Navigate to Django project
          cd myproject

          echo "Checking Docker installation..."

          docker --version
          docker compose version

          echo "Building Docker image..."

          docker compose build

          echo "Running Django database migrations..."

          docker compose run --rm web python manage.py migrate --noinput

          echo "Collecting Django static files..."

          docker compose run --rm web python manage.py collectstatic --noinput

          echo "Starting Docker application..."

          docker compose up -d --remove-orphans

          echo "Checking Docker containers..."

          docker compose ps

          echo "Checking application response..."

          for i in {1..15}; do
            if curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then
              echo "Application is responding successfully."
              break
            fi

            if [ "$i" -eq 15 ]; then
              echo "ERROR: Application did not respond."
              docker compose logs --tail=100 web
              exit 1
            fi

            sleep 2
          done

          echo "================================"
          echo "DEPLOYMENT SUCCESSFUL"
          echo "================================"
