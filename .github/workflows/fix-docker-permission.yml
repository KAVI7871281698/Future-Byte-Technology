
name: Fix Docker Permission on AWS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix-permission:
    runs-on: self-hosted

    steps:
      - name: Fix Docker group permissions
        shell: bash
        run: |
          set -euo pipefail

          echo "Adding ubuntu user to Docker group..."

          sudo usermod -aG docker ubuntu

          echo "Checking Docker service..."

          sudo systemctl enable docker
          sudo systemctl start docker

          echo "Restarting GitHub Actions runner service..."

          cd /home/ubuntu/actions-runner

          sudo ./svc.sh stop
          sudo ./svc.sh start

          echo "Docker permission setup completed."
