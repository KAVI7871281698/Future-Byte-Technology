<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account &bull; FutureByte</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            200: '#c7d2fe',
                            300: '#a5b4fc',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81',
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="min-h-screen bg-[#0f172a] text-slate-100 font-sans selection:bg-brand-500 selection:text-white flex items-center justify-center p-4 sm:p-6 lg:p-8 relative overflow-x-hidden">

    <!-- Ambient Glowing Background Elements -->
    <div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden">
        <div class="absolute -top-40 -right-40 w-96 h-96 bg-brand-600/25 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-indigo-500/20 rounded-full blur-3xl"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[550px] h-[550px] bg-sky-500/10 rounded-full blur-[100px]"></div>
        <div class="absolute inset-0 bg-[linear-gradient(to_right,#1e293b15_1px,transparent_1px),linear-gradient(to_bottom,#1e293b15_1px,transparent_1px)] bg-[size:4rem_4rem] [mask-image:radial-gradient(ellipse_60%_50%_at_50%_50%,#000_70%,transparent_100%)]"></div>
    </div>

    <!-- Main Container -->
    <div class="w-full max-w-md mx-auto">
        
        <!-- Brand Header / Logo -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-brand-600 via-indigo-500 to-sky-400 p-[2px] shadow-lg shadow-brand-500/20 mb-4 transition transform hover:scale-105 duration-200">
                <div class="w-full h-full bg-slate-900 rounded-[14px] flex items-center justify-center">
                    <i class="fa-solid fa-cube text-transparent bg-clip-text bg-gradient-to-tr from-brand-400 to-sky-400 text-2xl"></i>
                </div>
            </div>
            <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white">
                Create an account
            </h1>
            <p class="text-sm text-slate-400 mt-2">
                Join <span class="text-slate-300 font-medium">FutureByte</span> and get started
            </p>
        </div>

        <!-- Glassmorphism Card -->
        <div class="relative bg-slate-900/75 backdrop-blur-xl border border-slate-800/80 rounded-2xl shadow-2xl shadow-black/50 p-6 sm:p-8">
            
            <!-- Django Messages / Flash Alerts -->
            {% if messages %}
                <div class="space-y-3 mb-6">
                    {% for message in messages %}
                        <div class="flex items-start gap-3 p-3.5 rounded-xl text-sm border transition-all duration-200
                            {% if message.tags == 'error' %}
                                bg-rose-500/10 border-rose-500/30 text-rose-300
                            {% elif message.tags == 'success' %}
                                bg-emerald-500/10 border-emerald-500/30 text-emerald-300
                            {% else %}
                                bg-sky-500/10 border-sky-500/30 text-sky-300
                            {% endif %}">
                            <span class="mt-0.5">
                                {% if message.tags == 'error' %}
                                    <i class="fa-solid fa-circle-exclamation"></i>
                                {% else %}
                                    <i class="fa-solid fa-circle-check"></i>
                                {% endif %}
                            </span>
                            <span class="flex-1 font-medium leading-relaxed">{{ message }}</span>
                            <button type="button" onclick="this.parentElement.remove()" class="text-slate-400 hover:text-white transition">
                                <i class="fa-solid fa-xmark text-xs"></i>
                            </button>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}

            <!-- Sign Up Form -->
            <form method="POST" action="{% url 'signup' %}" id="signupForm" class="space-y-4">
                {% csrf_token %}

                <!-- Username Field -->
                <div>
                    <label for="username" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">
                        Username
                    </label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500 group-focus-within:text-brand-400 transition-colors">
                            <i class="fa-regular fa-user"></i>
                        </div>
                        <input 
                            type="text" 
                            name="username" 
                            id="username" 
                            required
                            autocomplete="username"
                            value="{{ username|default:'' }}"
                            placeholder="Choose a username"
                            class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-800/80 border border-slate-700/80 text-white placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500 transition-all duration-200"
                        >
                    </div>
                </div>

                <!-- Email Field -->
                <div>
                    <label for="email" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">
                        Email Address
                    </label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500 group-focus-within:text-brand-400 transition-colors">
                            <i class="fa-regular fa-envelope"></i>
                        </div>
                        <input 
                            type="email" 
                            name="email" 
                            id="email" 
                            required
                            autocomplete="email"
                            value="{{ email|default:'' }}"
                            placeholder="you@domain.com"
                            class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-800/80 border border-slate-700/80 text-white placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500 transition-all duration-200"
                        >
                    </div>
                </div>

                <!-- Password Field -->
                <div>
                    <label for="password" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">
                        Password (min 8 characters)
                    </label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500 group-focus-within:text-brand-400 transition-colors">
                            <i class="fa-solid fa-lock text-sm"></i>
                        </div>
                        <input 
                            type="password" 
                            name="password" 
                            id="password" 
                            required
                            minlength="8"
                            autocomplete="new-password"
                            placeholder="Create a strong password"
                            class="w-full pl-10 pr-11 py-2.5 rounded-xl bg-slate-800/80 border border-slate-700/80 text-white placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500 transition-all duration-200"
                        >
                        <button 
                            type="button" 
                            id="togglePassword" 
                            aria-label="Toggle password visibility"
                            class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-500 hover:text-slate-300 focus:outline-none transition-colors"
                        >
                            <i class="fa-regular fa-eye" id="passwordIcon"></i>
                        </button>
                    </div>
                </div>

                <!-- Confirm Password Field -->
                <div>
                    <label for="confirm_password" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">
                        Confirm Password
                    </label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500 group-focus-within:text-brand-400 transition-colors">
                            <i class="fa-solid fa-lock text-sm"></i>
                        </div>
                        <input 
                            type="password" 
                            name="confirm_password" 
                            id="confirm_password" 
                            required
                            autocomplete="new-password"
                            placeholder="Confirm your password"
                            class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-800/80 border border-slate-700/80 text-white placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500 transition-all duration-200"
                        >
                    </div>
                </div>

                <!-- Submit Button -->
                <button 
                    type="submit" 
                    id="submitBtn"
                    class="w-full mt-2 py-2.5 px-4 rounded-xl bg-gradient-to-r from-brand-600 via-indigo-600 to-sky-600 hover:from-brand-500 hover:via-indigo-500 hover:to-sky-500 text-white font-semibold text-sm shadow-lg shadow-brand-600/30 hover:shadow-brand-500/40 focus:outline-none focus:ring-2 focus:ring-brand-500/50 active:scale-[0.99] transition duration-200 flex items-center justify-center gap-2"
                >
                    <span id="btnText">Create Account</span>
                    <i class="fa-solid fa-arrow-right text-xs" id="btnArrow"></i>
                </button>
            </form>

            <!-- Sign In Link -->
            <p class="text-center text-xs text-slate-400 mt-6">
                Already have an account? 
                <a href="{% url 'login' %}" class="font-semibold text-brand-400 hover:text-brand-300 hover:underline transition">
                    Sign in here
                </a>
            </p>

        </div>

    </div>

    <script>
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const passwordIcon = document.getElementById('passwordIcon');

        if (togglePassword && passwordInput && passwordIcon) {
            togglePassword.addEventListener('click', () => {
                const isPassword = passwordInput.getAttribute('type') === 'password';
                passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
                if (isPassword) {
                    passwordIcon.classList.remove('fa-eye');
                    passwordIcon.classList.add('fa-eye-slash', 'text-brand-400');
                } else {
                    passwordIcon.classList.remove('fa-eye-slash', 'text-brand-400');
                    passwordIcon.classList.add('fa-eye');
                }
            });
        }
    </script>
</body>
</html>
